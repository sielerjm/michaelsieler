# Weekly OpenAlex sync for the hidden publications test page.
# Only commits Publications/openalex.rst (the marked OpenAlex block).
# The curated Publications/publications.rst page is never touched.

name: Sync OpenAlex publications

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate OpenAlex test page
        run: python scripts/sync_openalex_publications.py

      - name: Commit if the test page changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Publications/openalex.rst
          if git diff --staged --quiet; then
            echo "No changes to Publications/openalex.rst"
          else
            git commit -m "Update OpenAlex publications test page"
            git push
          fi
