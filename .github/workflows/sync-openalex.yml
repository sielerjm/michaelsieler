# Weekly OpenAlex sync for the live Publications page.
# Only commits Publications/publications.rst (the marked OpenAlex blocks).
# In-prep, talks, and Other are never rewritten.

name: Sync OpenAlex publications

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync OpenAlex publications
        run: python scripts/sync_openalex_publications.py

      - name: Commit if publications changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Publications/publications.rst
          if git diff --staged --quiet; then
            echo "No changes to Publications/publications.rst"
          else
            git commit -m "Update OpenAlex publications"
            git push
          fi
